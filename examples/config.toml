# snmp-mcp configuration
#
# Default location: ~/.config/snmp-mcp/config.toml
# Override with the SNMP_MCP_CONFIG env var (absolute path).
#
# Every device you want to poll gets a [hosts.<name>] table. The <name> is
# what you pass as `host` to MCP tool calls (it can be a hostname, an IP,
# or any nickname - it just has to match consistently).
#
# Credentials can ALSO be supplied via environment variables. Precedence:
#   1. Per-tool-call params (if explicitly passed)
#   2. Env vars (SNMP_MCP_<HOST>_COMMUNITY, SNMP_MCP_<HOST>_AUTH_PASS, ...)
#   3. Config file (this file)
#
# Never commit a real config file with credentials. Use `config.local.toml`
# (gitignored) or env vars in production.

[defaults]
port = 161
timeout = 3.0
retries = 2
verify_engine_id = true

# --- SNMPv2c example (most common) -------------------------------------------

[hosts.switch-core]
address = "10.0.0.10"
version = "v2c"
# community = "..."         # Prefer env var SNMP_MCP_SWITCH_CORE_COMMUNITY
port = 161

[hosts.printer-lobby]
address = "printer.example.com"
version = "v2c"
# community sourced from SNMP_MCP_PRINTER_LOBBY_COMMUNITY

# --- SNMPv1 example (legacy devices) -----------------------------------------

# [hosts.old-ups]
# address = "10.0.0.50"
# version = "v1"
# community = "public"

# --- SNMPv3 example (auth+priv, recommended for sensitive devices) -----------

# [hosts.secure-router]
# address = "10.0.0.1"
# version = "v3"
# user = "monitor"
# auth_proto = "SHA"          # MD5 / SHA / SHA224 / SHA256 / SHA384 / SHA512
# auth_pass = "..."           # Prefer env var SNMP_MCP_SECURE_ROUTER_AUTH_PASS
# priv_proto = "AES128"       # DES / 3DES / AES128 / AES192 / AES256
# priv_pass = "..."           # Prefer env var SNMP_MCP_SECURE_ROUTER_PRIV_PASS
# context = ""                # Optional SNMPv3 context name
